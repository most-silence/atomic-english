server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 运行时配置必须实时生效，不能被浏览器或 SW 缓存
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # 静态资源带 hash，可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service Worker 不缓存，保证版本更新能被检测到
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # manifest / icons
    location ~* \.(webmanifest|json|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # SPA fallback：?diag=1、刷新子路径都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
