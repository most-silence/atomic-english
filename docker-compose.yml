services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: atomic-english-web:local
    container_name: atomic-english-web
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      # 这是浏览器视角的 URL（config.js 在浏览器里执行）。
      # 浏览器和 Supabase 都在宿主机，用 127.0.0.1；容器不需要主动访问后端。
      SUPABASE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
